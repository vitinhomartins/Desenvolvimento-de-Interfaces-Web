<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
    <script src="https://kit.fontawesome.com/551f596e3b.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="container">
  <div class="card">

    <h2>Personal Data</h2>

    <div class="grid-2">
      <div class="input-group">
        <span><i class="fa-regular fa-address-card" style="color: rgb(14, 12, 159);"></i></span>
        <input type="text" placeholder="Full Name">
      </div>

      <div class="input-group">
        <span>🪪</span>
        <input type="text" placeholder="CPF">
      </div>

      <div class="input-group">
        <span><i class="fa-regular fa-calendar" style="color: rgb(14, 12, 159);"></i></i></span>
        <input type="date">
      </div>

      <div class="input-group">
        <span><i class="fa-solid fa-phone" style="color: rgb(14, 12, 159);"></i></span>
        <input type="text" placeholder="Phone Number">
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input type="password" placeholder="Password">
      </div>

      <div class="input-group">
        <span>🔒</span>
        <input type="password" placeholder="Confirm Password">
      </div>
    </div>

    <h2>Address</h2>

    <div class="grid-2">
      <div class="input-group">
        <span>📦</span>
        <input type="text" placeholder="ZIP Code (CEP)">
      </div>

      <div class="input-group">
        <span>📍</span>
        <input type="text" placeholder="Street">
      </div>

      <div class="input-group">
        <span>🏠</span>
        <input type="text" placeholder="Number">
      </div>

      <div class="input-group">
        <span>🏙</span>
        <input type="text" placeholder="City">
      </div>
    </div>

    <h2>Professional Data</h2>

    <div class="grid-2">
      <div class="input-group">
        <span>🏢</span>
        <input type="text" placeholder="Company">
      </div>

      <div class="input-group">
        <span>💼</span>
        <input type="text" placeholder="Job Title">
      </div>

      <div class="input-group">
        <span>💼</span>
        <input type="text" placeholder="Position">
      </div>

      <div class="input-group">
        <span>🔗</span>
        <input type="text" placeholder="LinkedIn URL">
      </div>
    </div>

    <button class="btn">Create Account</button>

  </div>
</div>

</body>
</html>
